[workspace]
resolver = "3"
members = [
    "crates/mt-core",
    "crates/mt-models",
    "crates/mt-ai",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
tempfile = "3"
wiremock = "0.6"

[profile.release.build-override]
strip = "none"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
